task: inconsistency
dataset:
  name: TIIL
  root: data/tiil
  split: test
target_model:
  architecture: ALBEF-ITM
  checkpoint: checkpoints/albef_itm.pth
target_score: image_text_inconsistency_score
evidence:
  visual: segment_anything
  visual_fallback: vit_patches
  textual: semantic_phrases
  relation_types: [contradiction, support]
pmesa:
  integration_points: 50
  restoration_paths: 6
  evidence_budget: 5
  relation_top_k: 3
  objective_weights: {contribution: 1.0, saliency: 1.0, coverage: 1.0, stability: 1.0}
  seeds: [17, 23, 42]
evaluation: [insertion_auc, deletion_auc, sufficiency, comprehensiveness, miou, word_f1, stability]
