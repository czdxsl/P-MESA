task: hallucination
dataset:
  name: M-HalDetect
  root: data/mhaldetect
  split: test
target_model:
  architecture: InstructBLIP-span-detector
  checkpoint: checkpoints/mhaldetect_span_detector.pt
target_score: span_hallucination_probability
evidence:
  visual: segment_anything
  visual_fallback: vit_patches
  textual: annotated_response_spans
  relation_types: [support, contradiction, absence-of-support]
pmesa:
  integration_points: 50
  restoration_paths: 6
  evidence_budget: 5
  relation_top_k: 3
  objective_weights: {contribution: 1.0, saliency: 1.0, coverage: 1.0, stability: 1.0}
  seeds: [17, 23, 42]
evaluation: [insertion_auc, deletion_auc, sufficiency, comprehensiveness, span_f1, stability]
