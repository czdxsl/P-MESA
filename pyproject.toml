[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmesa"
version = "1.0.0"
description = "Path-Guided Multimodal Evidence Subset Attribution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9",
  "PyYAML>=6",
  "torch>=2.0",
]

[project.optional-dependencies]
experiments = ["transformers>=4.38", "timm>=0.9", "spacy>=3.7"]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
pmesa = "pmesa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
